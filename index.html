<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Town: Sunpur</title>
<style>
:root{--bg:#0d0f14;--card:#171a22;--ink:#e8e6df;--mute:#8b8f9a;--accent:#e0a84a;--hp:#d9534f;--food:#e0a84a;--nerve:#6aa7e0;--line:#262a35}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:Georgia,"Noto Serif Devanagari","Nirmala UI","Times New Roman",serif;line-height:1.6}
body{background-color:#0d0f14;min-height:100vh;transition:background-color 1.6s ease}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 48px;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;letter-spacing:.06em;margin:4px 0 2px;color:var(--accent)}
.sub{color:var(--mute);font-size:13px;margin-bottom:12px;font-family:system-ui,"Nirmala UI",sans-serif}
.top,.stats,.meta{position:relative;z-index:2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;font-family:system-ui,"Nirmala UI",sans-serif;font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.fill{height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:system-ui,"Nirmala UI",sans-serif;font-size:12px;color:var(--mute);margin-bottom:10px}
.card.cinematic-foreground{animation:foregroundEnter .65s cubic-bezier(.2,.8,.2,1)}
@keyframes foregroundEnter{from{opacity:.2;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card{background:rgba(12,15,22,.93);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.32);contain:layout style}
h2{margin:0 0 8px;font-size:19px}
p{margin:0 0 10px}
.msg{color:var(--accent);font-style:italic}
.hint{background:#1d2230;border-left:3px solid var(--nerve);padding:8px 10px;border-radius:6px;font-size:14px;font-family:system-ui,"Nirmala UI",sans-serif}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
button{font:inherit;color:var(--ink);background:#20242f;border:1px solid #333a49;border-radius:10px;padding:12px 14px;min-height:46px;text-align:left;cursor:pointer;width:100%}
button:active{background:#2a3040}
button:disabled{opacity:.45;cursor:not-allowed}
button .need{display:block;font-family:system-ui,"Nirmala UI",sans-serif;font-size:12px;color:var(--mute);margin-top:2px}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);text-align:center;font-weight:bold}
button.mini{width:auto;min-height:34px;padding:6px 12px;font-size:13px;text-align:center;font-family:system-ui,"Nirmala UI",sans-serif}
button.hintbtn{background:transparent;border-style:dashed;color:var(--nerve);text-align:center;font-size:14px;margin-top:4px}
.stars{color:var(--accent);font-size:24px;letter-spacing:3px;margin-bottom:6px}
.small{font-family:system-ui,"Nirmala UI",sans-serif;font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row button{text-align:center;flex:1 1 140px}

/* ---------- ANIMATION LAYERS ---------- */
body[data-mood="dusk"]{background-color:#1a1420}
body[data-mood="evening"]{background-color:#12141c}
body[data-mood="night"]{background-color:#0b0d13}
body[data-mood="midnight"]{background-color:#150a0e}
body[data-mood="dawn"]{background-color:#231b17}
body[data-mood="morning"]{background-color:#27231c}
body[data-mood="day"]{background-color:#2c2820}
body[data-mood="good"]{background-color:#2e2514}
body[data-mood="bad"]{background-color:#080304}
body{--fog:.7}
body[data-mood="dusk"]{--fog:.5} body[data-mood="night"]{--fog:1} body[data-mood="midnight"]{--fog:1.6}
body[data-mood="dawn"]{--fog:.8} body[data-mood="morning"]{--fog:.5} body[data-mood="day"]{--fog:.3}
body[data-mood="good"]{--fog:.25} body[data-mood="bad"]{--fog:1.6}
.fog,#fx,.glow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
.fog{opacity:calc(var(--fog) * .55);transition:opacity 1.6s ease;overflow:hidden}
.fog::before,.fog::after{content:"";position:absolute;left:-40%;width:180%;height:60%;
  background:radial-gradient(ellipse at 30% 50%,rgba(210,220,235,.16),transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(210,220,235,.12),transparent 55%);
  will-change:transform;animation:drift 38s ease-in-out infinite alternate}
.fog::before{top:8%}
.fog::after{bottom:0;animation-duration:55s;animation-direction:alternate-reverse;opacity:.8}
.glow{background:radial-gradient(ellipse at 50% 0%,rgba(255,170,70,.30),transparent 62%);opacity:0;transition:opacity 1.2s ease}
body.lit .glow{opacity:1;animation:flicker 3.2s infinite}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes flicker{0%,100%{opacity:.9}8%{opacity:.6}14%{opacity:.95}30%{opacity:.75}47%{opacity:1}63%{opacity:.7}80%{opacity:.95}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-25deg)}70%{opacity:1;transform:scale(1.35) rotate(6deg)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-6px)}35%{transform:translateX(5px)}55%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
@keyframes hitflash{0%{filter:brightness(2.4)}100%{filter:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(217,83,79,0)}50%{box-shadow:0 0 22px rgba(217,83,79,.45)}}
@keyframes bell{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
.enter{animation:rise .5s ease-out both}
.enter .msg{animation:fadein 1s .15s both}
.enter .choices button{animation:rise .45s ease-out both}
.enter .choices button:nth-child(1){animation-delay:.10s}
.enter .choices button:nth-child(2){animation-delay:.18s}
.enter .choices button:nth-child(3){animation-delay:.26s}
.enter .choices button:nth-child(4){animation-delay:.34s}
.enter .choices button:nth-child(5){animation-delay:.42s}
.enter .choices button:nth-child(6){animation-delay:.50s}
.shake{animation:shake .4s}
.hint{animation:fadein .6s}
.stat.hit .fill{background:#ff6b66 !important;animation:hitflash .7s}
.stat.gain .fill{animation:hitflash .7s}
.card.mid{animation:pulseGlow 3s ease-in-out infinite}
.bellicon{display:inline-block;transform-origin:50% 0;animation:bell 1.6s ease-in-out infinite}
.end .st{opacity:0;display:inline-block;animation:pop .55s forwards}
.end h2{animation:fadein 1s .9s both}
.end .story{animation:fadein 1.2s 1.3s both}
.end .small,.end .row{animation:fadein 1s 2s both}
button.mini+button.mini{margin-left:6px}
.noanim *,.noanim *::before,.noanim *::after{animation:none !important;transition:none !important}
.noanim .fog,.noanim #fx,.noanim .glow{display:none}
.noanim .end .st{opacity:1}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .fog,#fx{display:none}
  .end .st{opacity:1}
}

/* ===== Full-screen animated story background ===== */
#sceneVisual{
  position:fixed; inset:0; width:100%; height:100vh; overflow:hidden;
  z-index:0; pointer-events:none; background:#080a10;
  contain:layout paint;
}
#sceneVisual .scene-sky{
  position:absolute; inset:0;
  background:linear-gradient(#11152b 0%,#33233b 58%,#0b1017 100%);
  transition:background 1.2s ease;
}
#sceneVisual .scene-stars{
  position:absolute; inset:0; opacity:.65;
  background-image:radial-gradient(circle,rgba(255,245,210,.9) 0 1px,transparent 1.8px);
  background-size:83px 71px; animation:starDrift 22s linear infinite;
}
#sceneVisual .moon{
  position:absolute; width:92px; height:92px; right:12%; top:11%;
  border-radius:50%; background:#fff0bd;
  box-shadow:0 0 45px rgba(255,236,170,.55);
  transition:opacity .8s,transform .8s,background .8s;
}
#sceneVisual .scene-art{position:absolute;inset:0;transition:opacity .5s,transform .8s;}
#sceneVisual .scene-fog{
  position:absolute;left:-15%;right:-15%;bottom:8%;height:31%;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(225,230,240,.18),rgba(225,230,240,.07) 34%,transparent 66%),
    radial-gradient(ellipse at 70% 42%,rgba(225,230,240,.14),rgba(225,230,240,.05) 32%,transparent 64%);
  animation:sceneFogMove 15s ease-in-out infinite alternate;
  opacity:.75;transition:opacity 1s;will-change:transform;
}
#sceneVisual .scene-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.72) 100%);
}
#sceneVisual .scene-caption{
  position:absolute;left:24px;bottom:22px;font:600 12px system-ui,sans-serif;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.52);
  text-shadow:0 2px 8px #000;
}

#sceneVisual .art-water{
  position:absolute;left:50%;bottom:24%;width:300px;height:112px;transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(120,155,175,.38),transparent 38%),
    repeating-radial-gradient(ellipse at center,rgba(105,150,175,.28) 0 3px,transparent 4px 12px),
    linear-gradient(#101c27,#071018);
  border:10px solid #30323a;
  box-shadow:0 15px 50px rgba(0,0,0,.7),inset 0 0 28px #02070a;
  animation:waterBreathe 3.8s ease-in-out infinite;
}
#sceneVisual .art-water:before,#sceneVisual .art-water:after{
  content:"";position:absolute;left:8%;right:8%;height:2px;
  background:rgba(185,215,225,.38);filter:blur(1px);
  animation:waterRipple 2.7s ease-in-out infinite;
}
#sceneVisual .art-water:before{top:35%}
#sceneVisual .art-water:after{top:62%;animation-delay:.9s}
#sceneVisual .art-glint{
  position:absolute;left:50%;bottom:30%;width:8px;height:8px;border-radius:50%;
  background:#fff8bf;
  box-shadow:0 0 7px 3px #ffe99a,0 0 22px 8px rgba(255,224,120,.55);
  animation:glintFlash 1.15s ease-in-out infinite;z-index:3;
}
#sceneVisual .art-glint:before,#sceneVisual .art-glint:after{
  content:"";position:absolute;left:50%;top:50%;width:30px;height:2px;
  background:rgba(255,245,190,.75);transform:translate(-50%,-50%);border-radius:2px;
}
#sceneVisual .art-glint:after{transform:translate(-50%,-50%) rotate(90deg)}
#sceneVisual .art-ripple{
  position:absolute;left:50%;bottom:30%;width:30px;height:12px;
  border:1px solid rgba(180,220,230,.55);border-radius:50%;
  transform:translate(-50%,50%);animation:glintRipple 1.8s ease-out infinite;
}
#sceneVisual .art-gate-light{
  position:absolute;left:50%;bottom:23%;width:340px;height:205px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 75%,rgba(190,205,220,.18),transparent 55%);
  animation:gateLight 4s ease-in-out infinite;
}
@keyframes waterBreathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.018,.97)}}
@keyframes waterRipple{0%,100%{transform:scaleX(.55);opacity:.2}50%{transform:scaleX(1);opacity:.6}}
@keyframes glintFlash{0%,100%{opacity:.25;transform:scale(.65)}45%{opacity:1;transform:scale(1.35)}60%{opacity:.75;transform:scale(.9)}}
@keyframes glintRipple{0%{transform:translate(-50%,50%) scale(.3);opacity:.8}100%{transform:translate(-50%,50%) scale(4);opacity:0}}
@keyframes gateLight{0%,100%{opacity:.45}50%{opacity:1}}
#sceneVisual .art-ground{
  position:absolute;left:-5%;right:-5%;bottom:-5%;height:34%;
  background:linear-gradient(transparent,#080b10 35%,#06080c 100%);
}
#sceneVisual .art-house{
  position:absolute;left:12%;bottom:25%;width:230px;height:145px;background:#101116;
  box-shadow:0 0 0 3px rgba(0,0,0,.35),0 20px 55px rgba(0,0,0,.35);
}
#sceneVisual .art-house:before{
  content:"";position:absolute;left:-28px;top:-85px;
  border-left:143px solid transparent;border-right:143px solid transparent;border-bottom:90px solid #0b0d12;
}
#sceneVisual .art-window{
  position:absolute;left:91px;top:50px;width:48px;height:58px;background:#c78e3d;
  box-shadow:0 0 35px rgba(225,164,69,.8);animation:sceneFlicker 2.4s infinite;
}
#sceneVisual .art-door{
  position:absolute;right:25px;bottom:0;width:48px;height:92px;background:#090a0d;border:2px solid #272832;
}
#sceneVisual .art-well{
  position:absolute;right:18%;bottom:25%;width:145px;height:72px;border-radius:50%;
  border:18px solid #282a31;background:#050609;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#sceneVisual .art-well:before{
  content:"";position:absolute;left:-4px;top:-72px;width:118px;height:54px;
  border-top:8px solid #282a31;border-left:7px solid #282a31;border-right:7px solid #282a31;
  transform:translateX(0);
}
#sceneVisual .art-tree{
  position:absolute;right:5%;bottom:20%;width:32px;height:230px;background:#0b0c10;border-radius:10px;
}
#sceneVisual .art-tree:before{
  content:"";position:absolute;width:190px;height:170px;left:-78px;top:-100px;border-radius:50%;
  background:#0b0d11;box-shadow:65px 18px 0 #0b0d11,-40px 42px 0 #0b0d11;
}
#sceneVisual .art-gate{
  position:absolute;left:50%;bottom:23%;width:300px;height:190px;transform:translateX(-50%);
  border-left:16px solid #30313a;border-right:16px solid #30313a;
  border-top:14px solid #30313a;box-shadow:0 15px 45px rgba(0,0,0,.55);
}
#sceneVisual .art-gate:before{
  content:"";position:absolute;inset:8px 0 0;
  background:repeating-linear-gradient(90deg,transparent 0 20px,#20222a 21px 28px);
  border-bottom:13px solid #292b33;
}
#sceneVisual .art-chain{
  position:absolute;left:50%;top:50%;width:28px;height:60px;transform:translate(-50%,-50%);
  border:5px solid #7a6d5d;border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.08);
}
#sceneVisual .art-temple{
  position:absolute;left:50%;bottom:24%;width:220px;height:145px;transform:translateX(-50%);
  background:#17151a;box-shadow:0 16px 40px rgba(0,0,0,.5);
}
#sceneVisual .art-temple:before{
  content:"";position:absolute;left:-38px;top:-78px;
  border-left:148px solid transparent;border-right:148px solid transparent;border-bottom:82px solid #100f14;
}
#sceneVisual .art-bell{
  position:absolute;left:50%;top:15px;width:54px;height:58px;transform:translateX(-50%);
  border-radius:45% 45% 30% 30%;background:#8b713f;
  box-shadow:0 0 28px rgba(217,176,82,.3);animation:bell 1.6s ease-in-out infinite;
}
#sceneVisual .art-figure{
  position:absolute;left:50%;bottom:23%;width:38px;height:115px;transform:translateX(-50%);
  background:#08090d;border-radius:20px 20px 6px 6px;box-shadow:0 0 35px rgba(0,0,0,.9);
}
#sceneVisual .art-figure:before{
  content:"";position:absolute;left:3px;top:-43px;width:32px;height:32px;border-radius:50%;background:#090a0d;
}
#sceneVisual .art-lantern{
  position:absolute;left:50%;bottom:31%;margin-left:35px;width:22px;height:30px;
  background:#d59b43;box-shadow:0 0 28px #d59b43;border-radius:5px;animation:sceneFlicker 1.6s infinite;
}
#sceneVisual.scene-pulse::before{animation:sceneBackgroundPulse .8s ease}
@keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(18px)}}
@keyframes sceneFogMove{from{transform:translateX(-4%)}to{transform:translateX(8%)}}
@keyframes sceneFlicker{0%,100%{opacity:.9}48%{opacity:.55}52%{opacity:1}}
@keyframes sceneBackgroundPulse{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
@media(max-width:600px){
  #sceneVisual .art-house{transform:scale(.72);transform-origin:left bottom}
  #sceneVisual .art-gate{transform:translateX(-50%) scale(.72);transform-origin:center bottom}
  #sceneVisual .art-temple{transform:translateX(-50%) scale(.72);transform-origin:center bottom}
  #sceneVisual .art-well{transform:scale(.72);transform-origin:right bottom}
  #sceneVisual .art-tree{transform:scale(.75);transform-origin:right bottom}
}


/* ===== CINEMATIC SCENE SYSTEM ===== */
#sceneVisual::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
  background:linear-gradient(180deg,rgba(0,0,0,.34),transparent 18%,transparent 78%,rgba(0,0,0,.5));
}
#sceneVisual::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:22;opacity:0;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,244,214,.16),rgba(255,236,190,.06) 55%,transparent 80%);
}
#sceneVisual .cinematic-beam{
  position:absolute;left:-15%;top:-20%;width:70%;height:140%;
  background:linear-gradient(105deg,transparent 0 34%,rgba(255,222,155,.04) 44%,rgba(255,222,155,.09) 50%,rgba(255,222,155,.04) 57%,transparent 70%);
  transform:rotate(9deg);opacity:.7;
  animation:beamDrift 13s ease-in-out infinite alternate;z-index:7;will-change:transform;
}
#sceneVisual .cinematic-dust{
  position:absolute;inset:0;z-index:8;opacity:.55;
  background-image:radial-gradient(circle,rgba(240,224,190,.55) 0 1px,transparent 1.5px);
  background-size:117px 93px;animation:dustFloat 18s linear infinite;
}
#sceneVisual .cinematic-shadow{
  position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,transparent 20%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.62) 100%);
}
#sceneVisual .scene-mist{
  position:absolute;left:-20%;right:-20%;bottom:7%;height:42%;z-index:10;
  background:
    radial-gradient(ellipse at 25% 55%,rgba(220,230,240,.12),rgba(220,230,240,.05) 28%,transparent 58%),
    radial-gradient(ellipse at 65% 42%,rgba(220,230,240,.09),rgba(220,230,240,.04) 26%,transparent 56%),
    radial-gradient(ellipse at 90% 68%,rgba(220,230,240,.1),rgba(220,230,240,.04) 24%,transparent 54%);
  animation:mistCrawl 17s ease-in-out infinite alternate;will-change:transform;
}
#sceneVisual .cinematic-title{
  position:absolute;left:50%;top:11%;transform:translateX(-50%);
  z-index:21;text-align:center;white-space:nowrap;
  font:700 clamp(13px,2vw,20px)/1.2 system-ui,sans-serif;
  letter-spacing:.28em;text-transform:uppercase;color:rgba(255,244,215,.58);
  text-shadow:0 2px 14px #000;opacity:.85;
}
#sceneVisual .cinematic-letterbox{
  position:absolute;left:0;right:0;height:6.5%;background:#000;z-index:25;
}
#sceneVisual .cinematic-letterbox.top{top:0}
#sceneVisual .cinematic-letterbox.bottom{bottom:0}
#sceneVisual .scene-rain{
  position:absolute;inset:-20%;z-index:11;opacity:0;display:none;
  background:repeating-linear-gradient(102deg,transparent 0 12px,rgba(190,210,225,.18) 13px,transparent 14px 28px);
  transform:rotate(8deg);will-change:transform;
}
#sceneVisual[data-atmosphere="rain"] .scene-rain,
#sceneVisual[data-atmosphere="storm"] .scene-rain{display:block;animation:rainFall .8s linear infinite}
#sceneVisual .scene-firefly{
  position:absolute;width:4px;height:4px;border-radius:50%;z-index:13;
  background:#ffe8a1;box-shadow:0 0 10px 3px rgba(255,224,130,.65);
  animation:firefly 3.8s ease-in-out infinite;
}
#sceneVisual .scene-firefly.f1{left:28%;bottom:35%;animation-delay:-.8s}
#sceneVisual .scene-firefly.f2{left:63%;bottom:43%;animation-delay:-2.2s}
#sceneVisual .scene-firefly.f3{left:78%;bottom:29%;animation-delay:-1.4s}
#sceneVisual.scene-shock .cinematic-shadow{animation:shockFlash .55s ease}
#sceneVisual.scene-shock .scene-art{animation:shockZoom .75s cubic-bezier(.2,.8,.2,1)}
@keyframes beamDrift{from{transform:translateX(-3%) rotate(9deg)}to{transform:translateX(30%) rotate(9deg)}}
@keyframes dustFloat{from{transform:translate3d(0,0,0)}to{transform:translate3d(30px,-18px,0)}}
@keyframes mistCrawl{from{transform:translateX(-4%)}to{transform:translateX(9%)}}
@keyframes rainFall{from{transform:translate(-2%,-2%) rotate(8deg)}to{transform:translate(5%,8%) rotate(8deg)}}
@keyframes firefly{0%,100%{opacity:.08;transform:translate(0,8px) scale(.5)}40%{opacity:1;transform:translate(22px,-18px) scale(1.2)}75%{opacity:.35;transform:translate(-10px,-36px) scale(.8)}}
@keyframes shockFlash{0%{opacity:1}18%{opacity:.25}100%{opacity:1}}
@keyframes shockZoom{0%{transform:scale(1.04)}100%{transform:scale(1)}}


/* ===== CINEMATIC V3: dramatic camera + atmosphere ===== */
#sceneVisual .camera-layer{
  position:absolute;inset:-5%;z-index:6;transform-origin:50% 55%;
  animation:cameraDrift 12s ease-in-out infinite alternate;will-change:transform;
}
#sceneVisual .light-flicker{
  position:absolute;inset:0;z-index:12;pointer-events:none;
  background:radial-gradient(circle at 50% 48%,rgba(255,207,125,.14),transparent 30%);
  animation:lightFlicker 3.2s steps(8,end) infinite;
}
#sceneVisual .fog-ribbon{
  position:absolute;left:-30%;right:-30%;bottom:16%;height:24%;
  z-index:14;opacity:.45;
  background:linear-gradient(90deg,transparent,rgba(215,225,235,.06) 28%,rgba(215,225,235,.13) 50%,rgba(215,225,235,.06) 72%,transparent);
  transform:skewY(-2deg);animation:fogRibbon 11s ease-in-out infinite alternate;will-change:transform;
}
#sceneVisual .dramatic-flash{
  position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none;
}
#sceneVisual .scene-breath{
  position:absolute;left:50%;bottom:20%;width:420px;height:230px;z-index:5;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.07),transparent 65%);
  animation:breath 4.5s ease-in-out infinite;
}
#sceneVisual .shadow-figure{
  position:absolute;z-index:16;left:50%;bottom:21%;width:34px;height:115px;
  transform:translateX(-50%);opacity:0;
  background:#030407;border-radius:18px 18px 6px 6px;
  box-shadow:0 0 35px 8px rgba(0,0,0,.55);
}
#sceneVisual .shadow-figure::before{
  content:"";position:absolute;left:2px;top:-39px;width:30px;height:30px;
  border-radius:50%;background:#020305;
}
#sceneVisual .shadow-figure::after{
  content:"";position:absolute;left:7px;top:34px;width:20px;height:4px;
  background:rgba(170,185,200,.16);filter:blur(2px);
}
#sceneVisual[data-atmosphere="heartbeat"] .shadow-figure{
  opacity:.92;animation:figureApproach 7s ease-in-out infinite alternate;
}
#sceneVisual[data-atmosphere="whisper"] .shadow-figure{
  opacity:.18;animation:figureSway 5s ease-in-out infinite;
}
#sceneVisual[data-atmosphere="bells"] .art-bell{animation:bellDramatic 2.2s ease-in-out infinite}
#sceneVisual[data-atmosphere="wind"] .art-tree{animation:treeSway 4.5s ease-in-out infinite}
#sceneVisual[data-atmosphere="ember"] .art-lantern{animation:lanternDramatic 1.1s ease-in-out infinite}
#sceneVisual[data-atmosphere="water"] .art-glint{animation:glintCinematic .9s ease-in-out infinite}
#sceneVisual[data-atmosphere="heartbeat"] .scene-breath{animation:breathFast 1.1s ease-in-out infinite}
@keyframes cameraDrift{
  0%{transform:scale(1.01) translate3d(-.5%,.2%,0)}
  50%{transform:scale(1.045) translate3d(.8%,-.4%,0)}
  100%{transform:scale(1.075) translate3d(-.7%,.6%,0)}
}
@keyframes lightFlicker{0%,100%{opacity:.55}12%{opacity:.7}14%{opacity:.25}37%{opacity:.6}39%{opacity:.34}71%{opacity:.8}73%{opacity:.42}}
@keyframes fogRibbon{from{transform:translateX(-4%) skewY(-2deg)}to{transform:translateX(12%) skewY(-2deg)}}
@keyframes breath{0%,100%{transform:translateX(-50%) scale(.9);opacity:.25}50%{transform:translateX(-50%) scale(1.08);opacity:.65}}
@keyframes breathFast{0%,100%{transform:translateX(-50%) scale(.82);opacity:.18}50%{transform:translateX(-50%) scale(1.14);opacity:.72}}
@keyframes figureApproach{from{transform:translateX(-50%) scale(.72);opacity:.62}to{transform:translateX(-50%) scale(1.18);opacity:.92}}
@keyframes figureSway{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-46%) rotate(2deg)}}
@keyframes bellDramatic{0%,100%{transform:translateX(-50%) rotate(-2deg)}20%{transform:translateX(-50%) rotate(8deg)}40%{transform:translateX(-50%) rotate(-7deg)}60%{transform:translateX(-50%) rotate(4deg)}}
@keyframes treeSway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}
@keyframes lanternDramatic{0%,100%{opacity:.72;transform:scale(1)}30%{opacity:1;transform:scale(1.08)}33%{opacity:.58;transform:scale(1)}65%{opacity:.93;transform:scale(1.03)}}
@keyframes glintCinematic{0%,100%{opacity:.12;transform:scale(.45)}35%{opacity:1;transform:scale(1.5)}55%{opacity:.65;transform:scale(.9)}}
@keyframes dramaticFlash{0%{opacity:0}10%{opacity:.7}24%{opacity:0}100%{opacity:0}}

</head>
<body>
<div id="sceneVisual" aria-label="Animated story scene">
  <div class="scene-sky"></div>
  <div class="scene-stars"></div>
  <div class="moon"></div>
  <div class="scene-art"></div>
  <div class="scene-fog"></div>
  <div class="scene-vignette"></div>
  <div class="scene-caption">Sunpur • Ghost Town</div><div class="scene-soundwave" aria-hidden="true"></div>
</div>

<div class="fog"></div><div class="glow"></div><canvas id="fx"></canvas>
<div class="wrap"><div id="app"></div></div>

<script>
/* ============ CONFIG (edit these) ============ */
const CONFIG = {
  FREE_HINTS: 3,          // free hints per playthrough
  UPI_ID: "8383028896@pthdfc",        // your UPI / Paytm handle
  UPI_NAME: "Ghost Town Sunpur",      // name shown inside the payment app
  UPI_AMOUNT: "10",                   // amount in rupees ("" = let the payer choose)
  EXTRA_HINTS_PER_PURCHASE: 3
};
/* Built from the fields above. UPI deep links only open on a phone that has a
   UPI app installed; on desktop the ID is shown instead so it can be copied. */
CONFIG.UPI_LINK = CONFIG.UPI_ID
  ? "upi://pay?pa="+CONFIG.UPI_ID   // VPA goes in raw; some UPI apps mis-read a %40
    + "&pn="+encodeURIComponent(CONFIG.UPI_NAME)
    + (CONFIG.UPI_AMOUNT ? "&am="+encodeURIComponent(CONFIG.UPI_AMOUNT) : "")
    + "&cu=INR"
    + "&tn="+encodeURIComponent("Hints")
  : "";

/* ============ BILINGUAL HELPERS ============ */
const L = (en, hi) => ({en, hi});
let lang = "en";
const tr = x => (x && (x[lang] || x.en)) || "";
const ITEM_HI = {"Brass key":"पीतल की चाबी","Rope":"रस्सी","Lantern":"लालटेन","Lit lantern":"जलती लालटेन","Matchbox":"माचिस","Iron key":"लोहे की चाबी","Logbook":"लॉगबुक","Photograph":"तस्वीर"};
const itemName = i => lang==="hi" ? (ITEM_HI[i]||i) : i;

const UI = {
  title: L("Ghost Town: Sunpur","घोस्ट टाउन: सुनपुर"),
  sub: L("A text survival game. Survive until dawn, or find out what happened here.","एक टेक्स्ट सर्वाइवल गेम। भोर तक ज़िंदा रहो, या पता लगाओ यहाँ क्या हुआ था।"),
  health: L("Health","सेहत"), food: L("Food","भोजन"), nerve: L("Nerve","हिम्मत"),
  carrying: L("Carrying: ","पास में: "), nothing: L("nothing","कुछ नहीं"),
  ch: n => L("Chapter "+n,"अध्याय "+n),
  again: L("Play again","फिर खेलो"), share: L("Share result","नतीजा शेयर करो"),
  next: L("Continue to Chapter 2","अध्याय 2 शुरू करो"), ch1: L("Chapter 1","अध्याय 1"),
  found: (a,b)=>L("Endings found: "+a+" of "+b+". Try again and find a better one.","मिले अंत: "+a+" / "+b+"। फिर खेलो और बेहतर अंत ढूँढो।"),
  copied: L("Copied. Paste it in WhatsApp.","कॉपी हो गया। WhatsApp में चिपकाओ।"),
  hint: n => L("Hint ("+n+" left)","संकेत ("+n+" बचे)"),
  nohints: L("No free hints left this run.","इस बार के मुफ़्त संकेत खत्म हो गए।"),
  buy: L("Buy more hints","और संकेत खरीदो"), paid: L("I've paid, give me hints","मैंने भुगतान कर दिया, संकेत दो"),
  payOpen: L("Opening your UPI app…","तुम्हारा UPI ऐप खुल रहा है…"),
  payManual: a => L("Pay "+(a?"₹"+a+" ":"")+"to this UPI ID, then tap \"I've paid\": ","इस UPI आईडी पर "+(a?"₹"+a+" ":"")+"भेजो, फिर \"मैंने भुगतान कर दिया\" दबाओ: "),
  payCopied: L("UPI ID copied.","UPI आईडी कॉपी हो गई।"),
  soundOn: L("Sound on","आवाज़ चालू"), soundOff: L("Sound off","आवाज़ बंद"),
  growl: L("Your stomach growls.","पेट में भूख कुलबुलाती है।")
};

/* ============ ENDINGS ============ */
const ENDINGS = {
  end_bell_diya:{stars:5, good:true, title:L("Dawn in Sunpur","सुनपुर की भोर"), text:L("The diya burns steady in the temple as you ring the bell three times. The watchman lowers his lantern, smiles for the first time in decades, and turns to mist. As the sun rises, the fog burns away and you see the road clearly. Behind you, the village looks like a place people once loved, not a place they ran from. You walk out slowly, unafraid.","मंदिर में दिया स्थिर जल रहा है, और तुम घंटी तीन बार बजाते हो। चौकीदार अपनी लालटेन नीचे करता है, दशकों में पहली बार मुस्कुराता है, और धुंध बनकर घुल जाता है। सूरज उगता है, कोहरा छँट जाता है और सड़क साफ़ दिखने लगती है। पीछे गाँव अब ऐसी जगह लगता है जिसे लोग कभी प्यार करते थे, ऐसी जगह नहीं जिससे वे भागे थे। तुम धीरे-धीरे, बिना डरे बाहर निकल जाते हो।")},
  end_peace:{stars:4, good:true, title:L("The Watchman's Rest","चौकीदार का विश्राम"), text:L("You tell Kalu that everyone reached safety because of him. His shoulders drop as if a weight has finally been lifted. He bows once, sets his lantern on the ground, and vanishes. The bell rings a last time on its own. At dawn, the fog is gone.","तुम कालू से कहते हो कि उसी की वजह से सब सुरक्षित पहुँचे। उसके कंधे ढीले पड़ जाते हैं, जैसे कोई बोझ उतर गया हो। वह एक बार झुकता है, लालटेन ज़मीन पर रखता है और ओझल हो जाता है। घंटी आख़िरी बार अपने आप बजती है। भोर तक कोहरा छँट चुका होता है।")},
  end_bell:{stars:3, good:true, title:L("Three Rings","तीन घंटियाँ"), text:L("You reach the temple and ring the bell three times. The watchman stops at the threshold of the shrine, nods, and fades. The fog stays until sunrise, and the temple feels colder without light in the diya. You survive, though you always wonder if he was truly at peace.","तुम मंदिर पहुँचकर घंटी तीन बार बजाते हो। चौकीदार गर्भगृह की देहरी पर रुकता है, सिर हिलाता है और ओझल हो जाता है। कोहरा सूरज उगने तक रहता है, और दिया बुझा होने से मंदिर कुछ ज़्यादा ठंडा लगता है। तुम बच जाते हो, पर सोचते रह जाते हो कि उसे सचमुच शांति मिली या नहीं।")},
  end_pointed:{stars:2, title:L("Pointed to the Gate","फाटक की ओर इशारा"), text:L("You have no idea what to say. The watchman lifts his lantern and points at the gate. The chain falls away by itself. You walk out into the fog, alive, but you never learn why the village is empty or who was waiting for you.","तुम्हें समझ नहीं आता कि क्या कहो। चौकीदार अपनी लालटेन उठाकर फाटक की ओर इशारा करता है। ज़ंजीर अपने आप गिर जाती है। तुम कोहरे में निकल जाते हो, ज़िंदा, पर कभी नहीं जान पाते कि गाँव खाली क्यों है या तुम्हारा इंतज़ार कौन कर रहा था।")},
  end_out:{stars:2, title:L("Out of the Fog","कोहरे के पार"), text:L("You leave before night falls. The fog parts just enough to let you through, and the village disappears behind you. You are alive, but you never learned the story of Sunpur, and some nights you still hear a bell.","रात होने से पहले तुम निकल जाते हो। कोहरा इतना खुल जाता है कि तुम निकल सको, और गाँव पीछे गुम हो जाता है। तुम ज़िंदा हो, पर सुनपुर की कहानी कभी नहीं जान पाए, और कुछ रातों को अब भी एक घंटी सुनाई देती है।")},
  end_lost_fog:{stars:1, title:L("Lost in the Fog","कोहरे में गुम"), text:L("You leave weak and shaken. The fog closes in, every direction looks the same, and the road never seems to end. Someone finds your torn shirt on the highway weeks later, but never finds you.","तुम कमज़ोर और सहमे हुए निकलते हो। कोहरा घिर आता है, हर दिशा एक-सी लगती है, और सड़क खत्म ही नहीं होती। हफ़्तों बाद हाईवे पर तुम्हारी फटी कमीज़ मिलती है, पर तुम कभी नहीं मिलते।")},
  end_lost:{stars:1, title:L("Swallowed by Fog","कोहरा निगल गया"), text:L("You run for the gate at midnight. The fog is faster than you, and it fills your lungs with cold. The last thing you hear is a bell.","आधी रात को तुम फाटक की ओर भागते हो। कोहरा तुमसे तेज़ है, और तुम्हारे फेफड़ों में ठंड भर देता है। आख़िरी चीज़ जो तुम सुनते हो, वह एक घंटी है।")},
  end_hidden:{stars:1, title:L("The Village Keeps You","गाँव ने रख लिया"), text:L("You hide in the haveli until dawn. The ringing stops, and when you try to leave, every door is barred from outside. The village keeps what it finds.","तुम भोर तक हवेली में छिपे रहते हो। घंटी थम जाती है, और जब तुम निकलना चाहते हो तो हर दरवाज़ा बाहर से बंद मिलता है। गाँव जो पाता है, उसे रख लेता है।")},
  end_frozen:{stars:1, title:L("Words Fail","शब्द नहीं मिले"), text:L("You open your mouth to speak, but your nerve is gone and only a squeak comes out. The watchman tilts his head, disappointed, and walks past you. The fog follows him. You wake at dawn, alive but hollow, with no memory of the night.","तुम बोलने को मुँह खोलते हो, पर हिम्मत जवाब दे चुकी है और सिर्फ़ एक चीख़-सी निकलती है। चौकीदार सिर टेढ़ा करके निराशा से देखता है और तुम्हारे पास से गुज़र जाता है। कोहरा उसके पीछे चला जाता है। भोर में तुम जागते हो, ज़िंदा पर खोखले, और रात की कोई याद नहीं।")},
  dead_hurt:{stars:0, title:L("Too Wounded","बहुत घायल"), text:L("Your injuries are too much. You sit down against the cold wall to rest, and the bell rings gently as the light fades.","चोटें तुम्हारी सहनशक्ति से ज़्यादा हैं। तुम आराम करने के लिए ठंडी दीवार से टिककर बैठ जाते हो, और रोशनी मद्धम होते ही घंटी धीरे से बजती है।")},
  starved:{stars:0, title:L("Hunger Wins","भूख जीत गई"), text:L("Hunger has made your legs weak and your mind blurry. You sit down and cannot get up. The village is very quiet.","भूख ने तुम्हारी टाँगें कमज़ोर और दिमाग़ धुँधला कर दिया है। तुम बैठ जाते हो और उठ नहीं पाते। गाँव बहुत शांत है।")},
  broken:{stars:0, title:L("Nerve Breaks","हिम्मत टूट गई"), text:L("Every sound is a footstep, every shadow a face. You run screaming into the dark, and you don't stop running. The village never sees you again.","हर आवाज़ किसी के क़दम लगती है, हर परछाईं कोई चेहरा। तुम चीख़ते हुए अँधेरे में भाग पड़ते हो, और रुकते नहीं। गाँव तुम्हें फिर कभी नहीं देखता।")},
  /* chapter 2 */
  end2_full:{stars:5, title:L("The Record and the Rest","सबूत और शांति"), text:L("You hand the logbook to a district magistrate, and within a month Sunpur's families are found, named, and compensated. On the same day, someone repaints the wall behind the temple and hangs a garland beneath the photograph. On the anniversary, Kalu's bell rings once, softly, and nobody is afraid of it.","तुम लॉगबुक ज़िला मजिस्ट्रेट को सौंपते हो, और एक महीने में सुनपुर के परिवारों को ढूँढा, पहचाना और मुआवज़ा दिया जाता है। उसी दिन कोई मंदिर के पीछे की दीवार रँग देता है और तस्वीर के नीचे माला टाँग देता है। बरसी पर कालू की घंटी एक बार धीरे से बजती है, और उससे कोई नहीं डरता।")},
  end2_record:{stars:4, title:L("The Record","सबूत"), text:L("The logbook reaches the right hands, and the truth about the flood is finally public. The families are compensated, but Kalu's face never appears in any report, and the shrine stays bare.","लॉगबुक सही हाथों तक पहुँचती है और बाढ़ की सच्चाई आख़िरकार सबके सामने आती है। परिवारों को मुआवज़ा मिलता है, पर किसी रिपोर्ट में कालू का चेहरा नहीं आता, और वह चबूतरा सूना ही रहता है।")},
  end2_photo:{stars:3, title:L("A Face for the Name","नाम को चेहरा"), text:L("Kalu's family is honoured in the village's memory, but with no proof of what happened, the official story never changes. People visit the shrine, but nobody is held to account.","गाँव की स्मृति में कालू के परिवार को सम्मान मिलता है, पर सबूत के बिना सरकारी कहानी नहीं बदलती। लोग उस स्थान पर आते हैं, पर किसी से जवाब नहीं माँगा जाता।")},
  end2_nothing:{stars:2, title:L("Just a Story","बस एक कहानी"), text:L("You board the bus with nothing but a tale. People listen politely at chai stalls, then change the subject. Sunpur stays what it was, a village that people say is haunted.","तुम बस में सिर्फ़ एक कहानी लेकर चढ़ते हो। चाय की दुकानों पर लोग शिष्टता से सुनते हैं, फिर बात बदल देते हैं। सुनपुर वही रहता है जो था: एक गाँव, जिसे लोग भुतहा कहते हैं।")}
};

const RANDOM_EVENTS = [
  L("A door closes somewhere behind you.","कहीं पीछे एक दरवाज़ा बंद होता है।"),
  L("You hear a child humming, then silence.","किसी बच्चे के गुनगुनाने की आवाज़ आती है, फिर सन्नाटा।"),
  L("Your shadow moves half a second late.","तुम्हारी परछाईं आधे पल देर से हिलती है।"),
  L("Something taps on the wall, three times.","दीवार पर तीन बार कोई थपथपाता है।"),
  L("The wind smells of wet earth and old smoke.","हवा में गीली मिट्टी और पुराने धुएँ की गंध है।")
];

/* ============ SCENES ============ */
const has = (s,i)=>s.inv.includes(i);
const needItem = (...items)=> s => {
  const m = items.filter(i=>!has(s,i));
  return m.length ? L("needs: "+m.join(", "), "चाहिए: "+m.map(i=>ITEM_HI[i]||i).join(", ")) : null;
};
const gateResult = s => (s.nerve>=4 && s.food>=3) ? "end_out" : "end_lost_fog";
const c2end = s => (has(s,"Logbook") && s.flags.photo_placed) ? "end2_full" : has(s,"Logbook") ? "end2_record" : s.flags.photo_placed ? "end2_photo" : "end2_nothing";

const SCENES = {
  courtyard:{
    title:L("The Courtyard","आँगन"),
    text:s=>L("You wake on cold stone as the sun sinks behind the hills. The village of Sunpur is silent. No dogs, no smoke. A crooked haveli looms ahead, a well sits in the corner, a rusted gate is at the far end, and a small temple stands beyond a broken wall. Somewhere, very faintly, a bell rings once.",
      "ढलते सूरज के साथ तुम ठंडे पत्थर पर जागते हो। सुनपुर गाँव में सन्नाटा है। न कुत्ते भौंकते हैं, न कहीं धुआँ। सामने एक टेढ़ी हवेली है, कोने में कुआँ, दूर छोर पर जंग लगा फाटक, और टूटी दीवार के पार एक छोटा मंदिर। कहीं बहुत दूर से एक घंटी की हल्की सी आवाज़ आती है।"),
    choices:[
      {t:L("Look into the well","कुएँ में झाँको"), to:"well", nav:true},
      {t:L("Enter the haveli","हवेली में जाओ"), to:"hall", nav:true},
      {t:L("Go to the gate","फाटक की ओर जाओ"), to:"gate", nav:true},
      {t:L("Follow the sound of the bell","घंटी की आवाज़ के पीछे जाओ"), to:"temple", nav:true}
    ]
  },
  well:{
    title:L("The Well","कुआँ"),
    text:s=>L("The well is deep. A bucket hangs from a frayed rope, and something glints under the dark water.","कुआँ गहरा है। एक बाल्टी घिसी हुई रस्सी से लटकी है, और काले पानी के नीचे कुछ चमक रहा है।"),
    choices:[
      {t:L("Drink some water","थोड़ा पानी पियो"), once:true, fx:{food:2, nerve:-1}, msg:L("It tastes of iron. Your reflection blinks a moment late.","पानी में लोहे का स्वाद है। तुम्हारी परछाईं पल भर देर से पलक झपकती है।"), to:"well"},
      {t:L("Fish out the glinting object","चमकती चीज़ निकालो"), once:true, give:"Brass key", fx:{nerve:-1}, msg:L("You pull up a heavy brass key. For a second, something cold holds the other end of the rope.","तुम एक भारी पीतल की चाबी खींच लाते हो। एक पल के लिए कोई ठंडा हाथ रस्सी का दूसरा सिरा थामे रहता है।"), to:"well"},
      {t:L("Cut the rope and take it","रस्सी काटकर रख लो"), once:true, give:"Rope", msg:L("Good, strong rope. It could help you climb.","मज़बूत रस्सी है। चढ़ने में काम आ सकती है।"), to:"well"},
      {t:L("Back to the courtyard","आँगन में लौटो"), to:"courtyard", nav:true}
    ]
  },
  hall:{
    title:L("The Haveli Hall","हवेली का हॉल"),
    text:s=> has(s,"Lit lantern")
      ? L("Your lantern throws golden light over peeling murals, a wooden staircase, and a kitchen door. The dust on the floor has fresh footprints. They are small.","तुम्हारी लालटेन की सुनहरी रोशनी उखड़ते भित्तिचित्रों, लकड़ी की सीढ़ी और रसोई के दरवाज़े पर पड़ती है। फ़र्श की धूल में ताज़ा पैरों के निशान हैं। बहुत छोटे।")
      : L("It's pitch dark inside. You feel dust, cobwebs, and a staircase under your hand. Something shifts near your feet.","अंदर घुप्प अँधेरा है। हाथ में धूल, जाले और सीढ़ी का किनारा आता है। पैरों के पास कुछ सरकता है।"),
    choices:[
      {t:L("Search the shelves","अलमारियाँ टटोलो"), once:true, give:"Lantern", msg:L("You find an old brass lantern, cold and empty of light.","एक पुरानी पीतल की लालटेन मिलती है, ठंडी और बिना रोशनी की।"), to:"hall"},
      {t:L("Light the lantern","लालटेन जलाओ"), need:s=> (has(s,"Lantern")&&has(s,"Matchbox")) ? null : L("needs: Lantern and Matchbox","चाहिए: लालटेन और माचिस"), hideIf:s=>has(s,"Lit lantern"), take:"Lantern", give:"Lit lantern", fx:{nerve:1}, msg:L("The flame catches. The dark backs away.","लौ पकड़ लेती है। अँधेरा पीछे हट जाता है।"), to:"hall"},
      {t:L("Go into the kitchen","रसोई में जाओ"), to:"kitchen", nav:true},
      {t:L("Climb the stairs","सीढ़ियाँ चढ़ो"), need:needItem("Lit lantern"), to:"upstairs", nav:true},
      {t:L("Back to the courtyard","आँगन में लौटो"), to:"courtyard", nav:true}
    ]
  },
  kitchen:{
    title:L("The Kitchen","रसोई"),
    text:s=>L("Clay pots, a cold chulha, and jars lined on a shelf. Everything is thick with dust, but one sealed jar of pickle looks untouched.","मिट्टी के बर्तन, ठंडा चूल्हा और अलमारी पर कतार में रखे मर्तबान। सब पर धूल की मोटी परत है, पर एक बंद अचार का मर्तबान अछूता लगता है।"),
    choices:[
      {t:L("Open the pickle jar","अचार का मर्तबान खोलो"), once:true, fx:{food:3, nerve:1}, msg:L("Sour, salty, oddly comforting. It tastes like someone's grandmother.","खट्टा, नमकीन, अजीब तरह से अपना-सा। जैसे किसी की दादी का बनाया हो।"), to:"kitchen"},
      {t:L("Take the matchbox from the shelf","अलमारी से माचिस लो"), once:true, give:"Matchbox", msg:L("Half full, and the matches are dry.","आधी भरी है, और तीलियाँ सूखी हैं।"), to:"kitchen"},
      {t:L("Eat the stale rotis","बासी रोटियाँ खाओ"), once:true, fx:{food:1, health:-3}, msg:L("Bad idea. Your stomach twists.","बुरा फ़ैसला। पेट में मरोड़ उठती है।"), to:"kitchen"},
      {t:L("Back to the hall","हॉल में लौटो"), to:"hall", nav:true}
    ]
  },
  upstairs:{
    title:L("The Child's Room","बच्चे का कमरा"),
    text:s=>L("A charpai, a cracked slate, and a diary tied with red thread. On the wall, in charcoal, are hundreds of tally marks and one line: \"The watchman waits for someone to ring the bell.\"","एक चारपाई, टूटी स्लेट और लाल धागे से बँधी एक डायरी। दीवार पर कोयले से सैकड़ों लकीरें खिंची हैं और एक पंक्ति लिखी है: \"चौकीदार इंतज़ार कर रहा है कि कोई घंटी बजाए।\""),
    choices:[
      {t:L("Read the diary","डायरी पढ़ो"), once:true, set:"diary", fx:{nerve:1}, msg:L("Sunpur was emptied overnight when the dam gates opened. Kalu the watchman rang the temple bell to warn everyone and got them all out, but he never came down from the temple himself. The last line: \"If anyone finds this, tell him he can rest. Ring the bell three times.\"","बाँध के फाटक खुलने पर सुनपुर एक रात में खाली हो गया। चौकीदार कालू ने मंदिर की घंटी बजाकर सबको चेताया और सबको निकाल दिया, पर वह खुद कभी मंदिर से नीचे नहीं उतरा। आख़िरी पंक्ति: \"अगर किसी को यह मिले, तो उससे कहना कि वह अब आराम कर सकता है। घंटी तीन बार बजाना।\""), to:"upstairs"},
      {t:L("Back to the hall","हॉल में लौटो"), to:"hall", nav:true}
    ]
  },
  temple:{
    title:L("The Small Temple","छोटा मंदिर"),
    text:s=>L("A tiny temple with a cracked stone deity, an unlit diya, and a brass bell hanging from a beam. Marigolds lie at the deity's feet, and they are still wet.","एक छोटा-सा मंदिर, जिसमें चटकी हुई पत्थर की मूर्ति है, एक बुझा हुआ दिया, और धरन से लटकी पीतल की घंटी। मूर्ति के चरणों में गेंदे के फूल पड़े हैं, और वे अब भी गीले हैं।"),
    choices:[
      {t:L("Light the diya","दिया जलाओ"), once:true, need:needItem("Matchbox"), set:"diya", fx:{nerve:2}, msg:L("The flame steadies. For the first time, the village feels less empty.","लौ स्थिर हो जाती है। पहली बार गाँव कुछ कम खाली लगता है।"), to:"temple"},
      {t:L("Pray quietly","चुपचाप प्रार्थना करो"), once:true, fx:{nerve:1}, msg:L("Whoever you pray to, it helps to say it out loud.","जिससे भी प्रार्थना करो, ज़ोर से बोलने पर मन को सहारा मिलता है।"), to:"temple"},
      {t:L("Ring the bell now","अभी घंटी बजाओ"), once:true, fx:{nerve:-2, turn:3}, set:"rang_early", msg:L("The sound rolls across the village. Something in the fog begins to move toward you. Time seems to have jumped.","आवाज़ पूरे गाँव में गूँज जाती है। कोहरे में कुछ तुम्हारी ओर बढ़ने लगता है। लगता है समय छलाँग लगा गया।"), to:"temple"},
      {t:L("Back to the courtyard","आँगन में लौटो"), to:"courtyard", nav:true}
    ]
  },
  gate:{
    title:L("The Gate","फाटक"),
    text:s=>L("A rusted iron gate, wrapped in chain. Beyond it a road disappears into a wall of white fog. The fog seems to lean toward you.","जंग लगा लोहे का फाटक, जिस पर ज़ंजीर लिपटी है। उसके पार सड़क सफ़ेद कोहरे की दीवार में खो जाती है। कोहरा तुम्हारी ओर झुकता-सा लगता है।"),
    choices:[
      {t:L("Unlock the gate and leave","फाटक खोलकर निकल जाओ"), need:needItem("Brass key"), to:gateResult},
      {t:L("Climb over using the rope","रस्सी की मदद से ऊपर चढ़ो"), need:needItem("Rope"), to:gateResult},
      {t:L("Shout for help","मदद के लिए चिल्लाओ"), once:true, fx:{nerve:-1}, msg:L("Your voice comes back in a different tone.","तुम्हारी आवाज़ बदली हुई लौटकर आती है।"), to:"gate"},
      {t:L("Back to the courtyard","आँगन में लौटो"), to:"courtyard", nav:true}
    ]
  },
  midnight:{
    title:L("Midnight","आधी रात"),
    text:s=>L("The bell begins to ring by itself. Fog crawls under the gate and fills the courtyard. From the temple steps, a tall figure with a lantern walks toward you. The watchman.","घंटी अपने आप बजने लगती है। फाटक के नीचे से कोहरा रेंगकर आँगन भर देता है। मंदिर की सीढ़ियों से लालटेन लिए एक लंबी आकृति तुम्हारी ओर आती है। चौकीदार।"),
    choices:[
      {t:L("Run to the temple and ring the bell three times","मंदिर की ओर दौड़ो और घंटी तीन बार बजाओ"), need:s=> s.flags.diary ? null : L("you don't know what the bell means yet","अभी तुम्हें घंटी का मतलब नहीं पता"), to:s=> s.flags.diya ? "end_bell_diya" : "end_bell"},
      {t:L("Speak to him calmly","शांति से उससे बात करो"), to:s=> s.flags.diary ? (s.nerve>=3 ? "end_peace" : "end_frozen") : "end_pointed"},
      {t:L("Hide in the haveli","हवेली में छिप जाओ"), fx:{health:-7}, to:"end_hidden"},
      {t:L("Run for the gate","फाटक की ओर भागो"), need:s=> (has(s,"Brass key")||has(s,"Rope")) ? null : L("needs: Brass key or Rope","चाहिए: पीतल की चाबी या रस्सी"), to:"end_lost"}
    ]
  },
  /* ---------- CHAPTER 2 ---------- */
  c2_path:{
    title:L("The Dry Path","सूखी पगडंडी"),
    text:s=>L("Dawn. The fog has gone, and the village looks small and ordinary in the pale light. On the temple wall, fresh charcoal letters read: \"Thank you. Now finish what he started.\" A dry path splits three ways: up to the dam office on the ridge, down to the reservoir bank, and out to the old bus stop on the highway. You have until the noon bus.","भोर हो चुकी है। कोहरा जा चुका है, और पीली रोशनी में गाँव छोटा और साधारण लगता है। मंदिर की दीवार पर कोयले से ताज़ा लिखा है: \"धन्यवाद। अब वह काम पूरा करो जो उसने शुरू किया था।\" सूखी पगडंडी तीन ओर जाती है: ऊपर टीले पर बाँध का दफ़्तर, नीचे जलाशय का किनारा, और बाहर हाईवे पर पुराना बस स्टॉप। दोपहर की बस तक तुम्हारे पास समय है।"),
    choices:[
      {t:L("Climb to the dam office","बाँध के दफ़्तर की ओर चढ़ो"), to:"c2_office", nav:true},
      {t:L("Go down to the reservoir bank","जलाशय के किनारे उतरो"), to:"c2_bank", nav:true},
      {t:L("Visit Kalu's shrine behind the temple","मंदिर के पीछे कालू के स्थान पर जाओ"), to:"c2_shrine", nav:true},
      {t:L("Walk to the bus stop","बस स्टॉप की ओर चलो"), to:"c2_bus", nav:true}
    ]
  },
  c2_bank:{
    title:L("Reservoir Bank","जलाशय का किनारा"),
    text:s=>L("The reservoir is still and brown. A rusted sluice wheel sticks out of the mud beside stone steps, and something is wrapped around its spokes.","जलाशय शांत और भूरा है। कीचड़ में पत्थर की सीढ़ियों के पास एक जंग लगा स्लुइस-पहिया निकला है, और उसकी तीलियों में कुछ लिपटा है।"),
    choices:[
      {t:L("Free the object from the wheel","पहिये से लिपटी चीज़ छुड़ाओ"), once:true, give:"Iron key", msg:L("A small iron key, tied in oilcloth. \"OFFICE\" is scratched into it.","तेल-कपड़े में बँधी एक छोटी लोहे की चाबी। उस पर 'दफ़्तर' खुरचा हुआ है।"), to:"c2_bank"},
      {t:L("Search the steps","सीढ़ियाँ टटोलो"), once:true, fx:{food:2}, msg:L("You find a rusted tiffin with dry chikki still sealed inside. Hard, but edible.","एक जंग लगा टिफ़िन मिलता है जिसमें सूखी चिक्की अब भी बंद है। सख़्त है, पर खाने लायक।"), to:"c2_bank"},
      {t:L("Drink from the reservoir","जलाशय से पानी पियो"), once:true, fx:{food:1, health:-2}, msg:L("Muddy and foul. Your stomach protests.","गंदा और बदबूदार। पेट विरोध करता है।"), to:"c2_bank"},
      {t:L("Back to the path","पगडंडी पर लौटो"), to:"c2_path", nav:true}
    ]
  },
  c2_office:{
    title:L("The Dam Office","बाँध का दफ़्तर"),
    text:s=>L("A squat concrete building with a steel door. Through a cracked window you see desks buried in papers.","स्टील के दरवाज़े वाली एक ठिगनी कंक्रीट की इमारत। टूटी खिड़की से काग़ज़ों में दबी मेज़ें दिखती हैं।"),
    choices:[
      {t:L("Unlock the door and go in","दरवाज़ा खोलकर अंदर जाओ"), need:needItem("Iron key"), to:"c2_desk", nav:true},
      {t:L("Back to the path","पगडंडी पर लौटो"), to:"c2_path", nav:true}
    ]
  },
  c2_desk:{
    title:L("Inside the Office","दफ़्तर के अंदर"),
    text:s=>L("Papers everywhere. A logbook lies open on the desk, and a steel cabinet stands behind it.","हर तरफ़ काग़ज़। मेज़ पर एक लॉगबुक खुली पड़ी है, और उसके पीछे एक स्टील की अलमारी।"),
    choices:[
      {t:L("Read the logbook","लॉगबुक पढ़ो"), once:true, give:"Logbook", set:"truth", fx:{nerve:-1}, msg:L("\"03:10. Order from the district office: open all gates. Do not warn residents. 03:14. Watchman Kalu telephoned twice. No one answered. He rang the temple bell instead.\" You take the logbook. It is proof.","\"03:10. ज़िला दफ़्तर से आदेश: सभी फाटक खोल दो। निवासियों को मत बताओ। 03:14. चौकीदार कालू ने दो बार फ़ोन किया। किसी ने नहीं उठाया। उसने मंदिर की घंटी बजा दी।\" तुम लॉगबुक ले लेते हो। यह सबूत है।"), to:"c2_desk"},
      {t:L("Open the steel cabinet","स्टील की अलमारी खोलो"), once:true, give:"Photograph", fx:{nerve:1}, msg:L("Inside is a framed photograph: a smiling family of four on temple steps. On the back: \"Kalu and family, Diwali.\"","अंदर एक फ़्रेम की हुई तस्वीर है: मंदिर की सीढ़ियों पर मुस्कुराता चार लोगों का परिवार। पीछे लिखा है: 'कालू और परिवार, दिवाली।'"), to:"c2_desk"},
      {t:L("Back outside","बाहर निकलो"), to:"c2_office", nav:true}
    ]
  },
  c2_shrine:{
    title:L("Kalu's Shrine","कालू का स्थान"),
    text:s=>L("Behind the temple is a small stone platform with a single nail in the wall where a frame could hang. Fresh marigolds lie below it.","मंदिर के पीछे एक छोटा पत्थर का चबूतरा है, जिसकी दीवार में एक अकेली कील है जहाँ कोई फ़्रेम टाँगा जा सकता है। नीचे ताज़े गेंदे के फूल हैं।"),
    choices:[
      {t:L("Hang the photograph on the nail","तस्वीर कील पर टाँगो"), once:true, need:needItem("Photograph"), take:"Photograph", set:"photo_placed", fx:{nerve:2}, msg:L("The family looks down at the village, together at last. The air feels lighter.","परिवार गाँव को देख रहा है, आख़िरकार साथ। हवा हल्की लगती है।"), to:"c2_shrine"},
      {t:L("Sit quietly for a moment","कुछ पल चुपचाप बैठो"), once:true, fx:{nerve:1}, msg:L("You feel watched, but kindly.","लगता है कोई देख रहा है, पर स्नेह से।"), to:"c2_shrine"},
      {t:L("Back to the path","पगडंडी पर लौटो"), to:"c2_path", nav:true}
    ]
  },
  c2_bus:{
    title:L("The Bus Stop","बस स्टॉप"),
    text:s=> s.flags.bus_forced
      ? L("The bus arrives with its horn blaring. The driver waves impatiently. You have to decide now.","बस हॉर्न बजाती हुई आ पहुँचती है। ड्राइवर बेसब्री से हाथ हिलाता है। अब फ़ैसला करना होगा।")

/* ============ STATE ============ */
let S;
function newGame(chapter){
  chapter = chapter || 1;
  S = {chapter, scene: chapter===1 ? "courtyard" : "c2_path", health: chapter===1 ? 10 : 8, food:5, nerve:7,
       turn:0, inv:[], flags:{}, msg:[], hint:null, hintsUsed:0, extraHints:0, hintNote:null, ending:null,
       prev:null, fresh:true, shake:false};
  render();
}
const clamp = v => Math.max(0, Math.min(10, v));
function timeLabel(s){
  const t = s.turn;
  if (s.chapter===1) return t<3 ? L("Dusk","शाम ढले") : t<6 ? L("Evening","साँझ") : t<9 ? L("Night","रात") : L("Midnight","आधी रात");
  return t<3 ? L("Dawn","भोर") : t<6 ? L("Morning","सुबह") : t<8 ? L("Late morning","दोपहर से पहले") : L("Noon","दोपहर");
}
function isVisible(sceneId, idx, c, s){
  if (c.once && s.flags["u_"+sceneId+"_"+idx]) return false;
  if (c.hideIf && c.hideIf(s)) return false;
  return true;
}

function choose(sceneId, idx){
  const c = SCENES[sceneId].choices[idx];
  const s = S;
  if (c.need && c.need(s)) return;
  const prev = {health:s.health, food:s.food, nerve:s.nerve};
  s.msg = c.msg ? [c.msg] : [];
  s.hint = null; s.hintNote = null;
  if (c.once) s.flags["u_"+sceneId+"_"+idx] = true;
  if (c.take) s.inv = s.inv.filter(i=>i!==c.take);
  if (c.give && !has(s,c.give)) s.inv.push(c.give);
  if (c.set) s.flags[c.set] = true;
  const fx = c.fx || {};
  s.health = clamp(s.health + (fx.health||0));
  s.food = clamp(s.food + (fx.food||0));
  s.nerve = clamp(s.nerve + (fx.nerve||0));
  const cost = c.nav ? 0 : 1;
  if (cost || fx.turn){
    const before = s.turn;
    s.turn += cost + (fx.turn||0);
    const ticks = Math.floor(s.turn/2) - Math.floor(before/2);
    if (ticks>0){ s.food = clamp(s.food - ticks); s.msg.push(UI.growl); }
    if (cost && Math.random() < 0.3 && s.chapter===1){
      s.nerve = clamp(s.nerve-1);
      s.msg.push(RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)]);
    }
  }
  let next = typeof c.to === "function" ? c.to(s) : c.to;
  if (!ENDINGS[next]){
    if (s.chapter===1 && s.turn>=9 && !s.flags.midnight){ s.flags.midnight = true; next = "midnight"; }
    if (s.chapter===2 && s.turn>=8 && !s.flags.bus_forced){ s.flags.bus_forced = true; next = "c2_bus"; }
  }
  if (s.health<=0) next = "dead_hurt";
  else if (s.food<=0) next = "starved";
  else if (s.nerve<=0) next = "broken";
  if (ENDINGS[next]){
    s.ending = next; saveEnding(next); if (ENDINGS[next].good) store("sunpur_ch2","1");
    playSound(ENDINGS[next].good ? "success" : "bad");
  } else {
    s.scene = next;
    if (s.scene==="well") playSound("water");
    else if (s.scene==="gate") { playSound("gate"); }
    else if (s.scene==="hall") playSound("creak");
    else if (s.scene==="temple" || s.scene==="midnight" || c.set==="rang_early") playSound("bell");
    else if (c.give) playSound("pickup");
    else if (s.health<prev.health || s.nerve<prev.nerve) playSound("hurt");
    else playSound(c.nav ? "move" : "click");
  }
  s.prev = prev; s.fresh = true; s.shake = (s.health<prev.health || s.nerve<prev.nerve);
  render();
  if (s.scene) setTimeout(()=>playSceneSound(s.scene), 180);
}

function useHint(){
  const s = S;
  const allowed = CONFIG.FREE_HINTS + s.extraHints;
  if (s.hintsUsed >= allowed){ s.hint = null; s.hintNote = "out"; render(); return; }
  s.hintsUsed++; s.hintNote = null;
  s.hint = HINTS[s.scene](s);
  playSound("hint");
  render();
}
function grantPaidHints(){ S.extraHints += CONFIG.EXTRA_HINTS_PER_PURCHASE; S.hintNote = null; render(); }

/* Tries to open a UPI app. If nothing handles the link (desktop, or no UPI app
   installed) the page stays visible, so we show the plain UPI ID instead and
   copy it to the clipboard — the player is never left with a dead button. */
function openUpi(){
  const note = document.getElementById("upinote");
  const show = t => { if (note) note.textContent = t; };
  if (!CONFIG.UPI_LINK) return;
  show(tr(UI.payOpen));
  try { window.location.href = CONFIG.UPI_LINK; } catch(e){}
  setTimeout(()=>{
    if (document.hidden) return;   // a UPI app took over; nothing to fall back to
    const manual = tr(UI.payManual(CONFIG.UPI_AMOUNT)) + CONFIG.UPI_ID;
    show(manual);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(CONFIG.UPI_ID)
          .then(()=> show(manual + " — " + tr(UI.payCopied)))
          .catch(()=>{});
    } catch(e){}
  }, 1200);
}

/* ---------- SOUND ENGINE: environmental, scene-aware Web Audio ---------- */
let soundOn = true;
let audioCtx = null, masterGain = null, ambientGain = null, ambientTimer = null, ambientScene = "";

function ensureAudio(){
  if (!soundOn) return false;
  try{
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return true;
  }catch(e){ return false; }
}

function tone(freq,duration,type="sine",volume=.12,when=0){
  if(!ensureAudio()) return;
  const now=audioCtx.currentTime+when;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,now);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.001,volume),now+.015);
  g.gain.exponentialRampToValueAtTime(.0001,now+duration);
  o.connect(g); g.connect(masterGain); o.start(now); o.stop(now+duration+.03);
}

function noise(duration=.18,volume=.06,filterFreq=900){
  if(!ensureAudio()) return;
  const len=Math.max(1,Math.floor(audioCtx.sampleRate*duration));
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.7);
  const src=audioCtx.createBufferSource(), f=audioCtx.createBiquadFilter(), g=audioCtx.createGain();
  f.type="lowpass"; f.frequency.value=filterFreq; g.gain.value=volume;
  src.buffer=buf; src.connect(f); f.connect(g); g.connect(masterGain); src.start();
}

function bellSound(){
  tone(196,.95,"sine",.11);
  tone(294,1.05,"sine",.06,.04);
  tone(392,1.25,"sine",.035,.10);
}

function waterSound(){
  noise(.75,.045,1400);
  tone(165,.8,"sine",.018);
}

function windSound(){
  noise(1.2,.025,700);
  tone(74,1.4,"sine",.018);
}

function gateSound(){
  tone(92,.65,"sawtooth",.035);
  tone(138,.9,"triangle",.028,.15);
  noise(.5,.025,600);
}

function creakSound(){
  tone(110,.65,"sawtooth",.035);
  tone(155,.48,"triangle",.025,.16);
}

function heartbeatSound(){
  tone(72,.10,"sine",.055);
  tone(58,.11,"sine",.045,.17);
}

function playSceneSound(scene){
  if(!soundOn) return;
  switch(String(scene||"")){
    case "well":
      waterSound(); setTimeout(()=>{ if(soundOn) tone(920,.16,"sine",.035); },260);
      break;
    case "gate":
      windSound(); setTimeout(()=>{ if(soundOn) gateSound(); },220);
      break;
    case "hall": case "kitchen":
      creakSound(); setTimeout(()=>{ if(soundOn) windSound(); },420);
      break;
    case "upstairs":
      windSound(); setTimeout(()=>{ if(soundOn) tone(310,.55,"sine",.018); },380);
      break;
    case "temple":
      setTimeout(()=>{ if(soundOn) bellSound(); },120);
      break;
    case "midnight":
      windSound(); setTimeout(()=>{ if(soundOn) heartbeatSound(); },300);
      setTimeout(()=>{ if(soundOn) heartbeatSound(); },760);
      break;
  }
}
function playSound(kind){
  if(!soundOn || !ensureAudio()) return;
  switch(kind){
    case "click": tone(520,.055,"sine",.06); break;
    case "move": tone(240,.09,"triangle",.05); tone(360,.12,"triangle",.04,.045); break;
    case "item": case "pickup": tone(440,.10,"sine",.07); tone(660,.16,"sine",.06,.09); break;
    case "success": tone(392,.14,"sine",.07); tone(523.25,.16,"sine",.075,.11); tone(659.25,.24,"sine",.08,.24); break;
    case "bad": tone(220,.20,"sawtooth",.04); tone(155,.28,"triangle",.05,.12); break;
    case "hint": tone(660,.10,"sine",.05); tone(880,.18,"sine",.045,.10); break;
    case "bell": bellSound(); break;
    case "water": waterSound(); break;
    case "wind": windSound(); break;
    case "gate": gateSound(); break;
    case "creak": creakSound(); break;
    case "heartbeat": heartbeatSound(); break;
    case "hurt": noise(.22,.05,850); tone(120,.24,"sawtooth",.045); break;
  }
}

function startAmbient(){
  if(!soundOn || !ensureAudio()) return;
  stopAmbient();
  ambientScene = "";
  ambientTimer=setInterval(()=>{
    if(!soundOn || document.hidden) return;
    const s=window.S||{};
    const scene=String(s.scene||"courtyard");
    if(scene!==ambientScene){ ambientScene=scene; }
    if(scene==="well") waterSound();
    else if(scene==="gate") { windSound(); if(Math.random()<.45) gateSound(); }
    else if(scene==="midnight") { windSound(); if(Math.random()<.35) heartbeatSound(); }
    else if(scene==="temple") { windSound(); if(Math.random()<.22) bellSound(); }
    else if(scene==="hall"||scene==="upstairs"||scene==="kitchen") { windSound(); if(Math.random()<.18) creakSound(); }
    else windSound();
  },4200);
}
function stopAmbient(){
  if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null;}
}
function toggleSound(){
  soundOn = !soundOn;
  store("sunpur_sound", soundOn ? "1" : "0");
  if (soundOn){
    ensureAudio(); startAmbient(); playSound("click");
  } else {
    stopAmbient();
    if (audioCtx && audioCtx.state !== "closed"){
      try{ audioCtx.suspend(); }catch(e){}
    }
  }
  render();
}

let fxOn = true, rafId = null, lastT = 0, dpr = 1;
const MOTES = [];
const MOTE_RGB = {dusk:"200,170,220",evening:"180,190,220",night:"170,190,230",midnight:"235,120,120",dawn:"255,214,140",morning:"255,230,170",day:"255,240,200",good:"255,215,120",bad:"150,60,60"};
function initMotes(){ for(let i=0;i<26;i++) MOTES.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2,vx:(Math.random()-.5)*0.00004,vy:-(0.00002+Math.random()*0.00004),ph:Math.random()*6.28}); }
let fxCanvas = null, fxCtx = null, fxMood = "", fxRGB = "200,200,220", lastDraw = 0;
const FX_FRAME_MS = 33; /* cap motes at ~30fps; they are slow-moving, so this is invisible */
function fxSurface(){
  if (!fxCanvas){
    fxCanvas = document.getElementById("fx");
    if (!fxCanvas || !fxCanvas.getContext) return null;
    fxCtx = fxCanvas.getContext("2d", {alpha:true});
  }
  return fxCtx ? fxCanvas : null;
}
function resizeFx(){
  const cv = fxSurface(); if(!cv) return;
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.floor((window.innerWidth||360)*dpr), h = Math.floor((window.innerHeight||640)*dpr);
  /* mobile browsers fire resize constantly as the URL bar hides: skip no-op reallocations */
  if (cv.width === w && cv.height === h) return;
  cv.width = w; cv.height = h;
}
let resizeTimer = null;
function resizeFxDeferred(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ resizeTimer = null; resizeFx(); }, 150);
}
function loop(t){
  if (!fxOn || document.hidden){ rafId = null; return; }
  const cv = fxSurface();
  if (!cv){ rafId = null; return; }
  rafId = requestAnimationFrame(loop);
  if (t - lastDraw < FX_FRAME_MS) return;
  const c = fxCtx;
  const w = cv.width, hh = cv.height, dt = Math.min(50, t-lastT||16);
  lastT = t; lastDraw = t;
  c.clearRect(0,0,w,hh);
  const mood = document.body.getAttribute("data-mood");
  if (mood !== fxMood){ fxMood = mood; fxRGB = MOTE_RGB[mood] || "200,200,220"; }
  const rgb = fxRGB, tw = t*0.0015, rad = dpr;
  for (let i=0;i<MOTES.length;i++){
    const m = MOTES[i];
    m.x += m.vx*dt; m.y += m.vy*dt;
    if (m.y<-0.02){ m.y=1.02; m.x=Math.random(); }
    if (m.x<-0.02) m.x=1.02; else if (m.x>1.02) m.x=-0.02;
    const a = .12 + .32*(0.5+0.5*Math.sin(tw+m.ph));
    c.fillStyle = "rgba("+rgb+","+a.toFixed(2)+")";
    c.beginPath(); c.arc(m.x*w, m.y*hh, m.r*rad, 0, 6.283); c.fill();
  }
}
function applyFx(){
  if (!document.body) return;
  document.body.classList.toggle("noanim", !fxOn);
  if (fxOn){ if (!rafId && typeof requestAnimationFrame==="function") rafId = requestAnimationFrame(loop); }
  else { if (rafId && typeof cancelAnimationFrame==="function") cancelAnimationFrame(rafId); rafId = null; }
}

function render(){
  const app = document.getElementById("app");
  const s = S;
  const found = loadEndings().length, total = Object.keys(ENDINGS).length;
  const pv = s.prev || {health:s.health, food:s.food, nerve:s.nerve};
  const fresh = s.fresh && fxOn, shake = s.shake && fxOn;
  if (s.ending){
    if (window.updateGhostTownScene) window.updateGhostTownScene(s.scene || "midnight");
    const e = ENDINGS[s.ending];
    const ch2ok = fetchKey("sunpur_ch2")==="1" && s.chapter===1;
    let stars = "";
    for (let i=0;i<5;i++) stars += '<span class="st" style="animation-delay:'+(0.25+i*0.18).toFixed(2)+'s">'+(i<e.stars?"★":"☆")+'</span>';
    app.innerHTML = header()+
      '<div class="card end'+(fresh?' enter':'')+'">'+
      '<div class="stars">'+stars+'</div>'+
      '<h2>'+esc(tr(e.title))+'</h2>'+
      (s.msg.length ? '<p class="msg">'+esc(s.msg.map(tr).join(" "))+'</p>' : '')+
      '<p class="story">'+esc(tr(e.text))+'</p>'+
      '<p class="small">'+esc(tr(UI.found(found,total)))+'</p>'+
      '<div class="row"><button class="primary" id="again">'+esc(tr(UI.again))+'</button><button class="primary" id="share">'+esc(tr(UI.share))+'</button>'+
      (ch2ok ? '<button class="primary" id="ch2">'+esc(tr(UI.next))+'</button>' : '')+
      (s.chapter===2 ? '<button class="primary" id="ch1">'+esc(tr(UI.ch1))+'</button>' : '')+
      '</div><p class="small" id="shared"></p></div>';
    bindTop();
    document.getElementById("again").onclick = ()=>newGame(s.chapter);
    document.getElementById("share").onclick = share;
    if (ch2ok) document.getElementById("ch2").onclick = ()=>newGame(2);
    if (s.chapter===2) document.getElementById("ch1").onclick = ()=>newGame(1);
    setMood(s);
    s.prev = {health:s.health, food:s.food, nerve:s.nerve}; s.fresh = false; s.shake = false;
    return;
  }
  if (window.updateGhostTownScene) window.updateGhostTownScene(s.scene);
  const sc = SCENES[s.scene];
  const allowed = CONFIG.FREE_HINTS + s.extraHints;
  const left = Math.max(0, allowed - s.hintsUsed);
  const bellIcon = (s.scene==="midnight" || s.scene==="temple") ? '<span class="bellicon">🔔</span> ' : '';
  let html = header()+
    '<div class="stats">'+bar(UI.health,"health",s.health,pv.health)+bar(UI.food,"food",s.food,pv.food)+bar(UI.nerve,"nerve",s.nerve,pv.nerve)+'</div>'+
    '<div class="meta"><span>'+esc(tr(timeLabel(s)))+'</span><span>'+esc(tr(UI.carrying))+(s.inv.length? esc(s.inv.map(itemName).join(", ")) : esc(tr(UI.nothing)))+'</span></div>'+
    '<div class="card cinematic-foreground'+(fresh?' enter':'')+(shake?' shake':'')+(s.scene==="midnight"?' mid':'')+'"><h2>'+bellIcon+esc(tr(sc.title))+'</h2>'+
    (s.msg.length ? '<p class="msg">'+esc(s.msg.map(tr).join(" "))+'</p>' : '')+
    '<p>'+esc(tr(sc.text(s)))+'</p>'+
    (s.hint ? '<p class="hint">'+esc(tr(s.hint))+'</p>' : '')+
    (s.hintNote==="out" ? '<p class="hint">'+esc(tr(UI.nohints))+'</p>' : '')+
    '<div class="choices">';
  sc.choices.forEach((c,i)=>{
    if (!isVisible(s.scene,i,c,s)) return;
    const hint = c.need ? c.need(s) : null;
    html += '<button data-i="'+i+'"'+(hint?' disabled':'')+'>'+esc(tr(c.t))+(hint?'<span class="need">'+esc(tr(hint))+'</span>':'')+'</button>';
  });
  if (s.hintNote==="out"){
    if (CONFIG.UPI_LINK) html += '<button class="hintbtn" id="buy">'+esc(tr(UI.buy))+'</button><button class="hintbtn" id="paid">'+esc(tr(UI.paid))+'</button><p class="small" id="upinote"></p>';
  } else {
    html += '<button class="hintbtn" id="hint">'+esc(tr(UI.hint(left)))+'</button>';
  }
  html += '</div></div>';
  app.innerHTML = html;
  bindTop();
  app.querySelectorAll("button[data-i]").forEach(b=>{
    b.onclick = ()=> choose(s.scene, parseInt(b.getAttribute("data-i"),10));
  });
  const hb = document.getElementById("hint"); if (hb) hb.onclick = useHint;
  const buy = document.getElementById("buy"); if (buy) buy.onclick = openUpi;
  const paid = document.getElementById("paid"); if (paid) paid.onclick = grantPaidHints;
  setMood(s);
  animateBars();
  s.prev = {health:s.health, food:s.food, nerve:s.nerve}; s.fresh = false; s.shake = false;
}

function share(){
  const e = ENDINGS[S.ending];
  const stars = e.stars ? "★".repeat(e.stars) : "☆";
  const text = (lang==="hi"
    ? '"'+tr(e.title)+'" '+stars+' — घोस्ट टाउन: सुनपुर में मेरा अंत। क्या तुम बेहतर अंत ढूँढ सकते हो?'
    : 'I got "'+tr(e.title)+'" '+stars+' in Ghost Town: Sunpur. Can you find the best ending?')
    + (location.protocol.startsWith("http") ? " "+location.href : "");
  const note = document.getElementById("shared");
  if (navigator.share){ navigator.share({text}).catch(()=>{}); return; }
  if (navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>{ note.textContent = tr(UI.copied); }).catch(()=>{ note.textContent = text; }); }
  else note.textContent = text;
}

const savedLang = fetchKey("sunpur_lang");
if (savedLang==="hi" || savedLang==="en") lang = savedLang;
const reducedMotion = typeof matchMedia==="function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const savedFx = fetchKey("sunpur_fx");
fxOn = savedFx===null ? !reducedMotion : savedFx==="1";
const savedSound = fetchKey("sunpur_sound");
soundOn = savedSound===null ? true : savedSound==="1";
initMotes();
if (window.addEventListener) window.addEventListener("resize", resizeFxDeferred, {passive:true});
if (document.addEventListener) document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){
    if (rafId && typeof cancelAnimationFrame==="function") cancelAnimationFrame(rafId);
    rafId = null;
    stopAmbient();
  } else {
    applyFx();
    if (soundOn && audioCtx) startAmbient();
  }
});
newGame(1);
resizeFx();
applyFx();

/* ===== CINEMATIC SCENE DIRECTOR ===== */
(function(){
  const panel=document.getElementById('sceneVisual');
  if(!panel) return;
  const sky=panel.querySelector('.scene-sky');
  const moon=panel.querySelector('.moon');
  const art=panel.querySelector('.scene-art');
  const fog=panel.querySelector('.scene-fog');
  const caption=panel.querySelector('.scene-caption');

  function setAtmosphere(type){
    panel.dataset.atmosphere=type;
    if(rainEl) rainEl.style.opacity=(type==="rain"||type==="storm")?".72":"0";
  }

  /* These overlay layers are identical for every scene, so they are created once
     and reused. Rebuilding them per scene change stacked up duplicate full-screen
     animated layers and got slower the longer you played. */
  const extrasMarkup = `<div class="camera-layer">
      <div class="cinematic-beam"></div><div class="cinematic-dust"></div>
      <div class="cinematic-shadow"></div><div class="scene-mist"></div>
      <div class="fog-ribbon"></div><div class="scene-breath"></div>
      <div class="light-flicker"></div><div class="shadow-figure"></div>
      <div class="cinematic-title"></div>
      <div class="scene-rain"></div>
      <div class="scene-firefly f1"></div><div class="scene-firefly f2"></div><div class="scene-firefly f3"></div>
      <div class="cinematic-letterbox top"></div><div class="cinematic-letterbox bottom"></div>
    </div><div class="dramatic-flash"></div>`;
  panel.insertAdjacentHTML("beforeend", extrasMarkup);
  const cinTitle = panel.querySelector(".cinematic-title");
  const rainEl   = panel.querySelector(".scene-rain");
  const flashEl  = panel.querySelector(".dramatic-flash");
  let currentScene = null;

  const SCENE_DATA = (function(){
    const scenes={
      courtyard:{
        bg:"linear-gradient(#17162e 0%,#5a3549 56%,#080e14 100%)",
        cap:"Sunpur • The Courtyard", atm:"mist",
        art:`<div class="art-house"><div class="art-window"></div><div class="art-door"></div></div>
             <div class="art-well"></div><div class="art-tree"></div><div class="art-ground"></div>`
      },
      well:{
        bg:"linear-gradient(#06101d 0%,#263b4a 55%,#03090e 100%)",
        cap:"Sunpur • The Old Well", atm:"water",
        art:`<div class="art-well" style="right:38%;bottom:24%;transform:scale(1.38)"></div>
             <div class="art-water"></div><div class="art-glint"></div><div class="art-ripple"></div>
             <div class="art-tree"></div><div class="art-ground"></div>`
      },
      hall:{
        bg:"linear-gradient(#04060c,#1b1722 58%,#04070a)",
        cap:"Sunpur • The Abandoned Haveli", atm:"dark",
        art:`<div class="art-house" style="left:50%;bottom:24%;transform:translateX(-50%) scale(1.35)">
               <div class="art-window"></div><div class="art-door"></div></div>
             <div class="art-tree"></div><div class="art-ground"></div>`
      },
      kitchen:{
        bg:"linear-gradient(#07090d,#30231c 58%,#06080b)",
        cap:"Sunpur • The Cold Kitchen", atm:"ember",
        art:`<div class="art-house" style="left:50%;bottom:24%;transform:translateX(-50%) scale(.98)">
               <div class="art-door"></div><div class="art-window" style="opacity:.22"></div></div>
             <div class="art-lantern"></div><div class="art-ground"></div>`
      },
      upstairs:{
        bg:"linear-gradient(#070912,#211923 58%,#05070c)",
        cap:"Sunpur • The Child's Room", atm:"whisper",
        art:`<div class="art-house" style="left:50%;bottom:24%;transform:translateX(-50%) scale(1.08)">
               <div class="art-window"></div></div>
             <div class="art-figure" style="opacity:.18;left:66%;bottom:24%"></div><div class="art-ground"></div>`
      },
      temple:{
        bg:"linear-gradient(#070a18,#35243b 57%,#070a10)",
        cap:"Sunpur • The Small Temple", atm:"bells",
        art:`<div class="art-temple"><div class="art-bell"></div></div>
             <div class="art-lantern"></div><div class="art-ground"></div>`
      },
      gate:{
        bg:"linear-gradient(#020510,#18283c 57%,#050a10)",
        cap:"Sunpur • The Rusted Gate", atm:"wind",
        art:`<div class="art-gate-light"></div><div class="art-gate"><div class="art-chain"></div></div>
             <div class="art-tree"></div><div class="art-ground"></div>`
      },
      midnight:{
        bg:"linear-gradient(#010209,#100817 54%,#030509)",
        cap:"Sunpur • Midnight", atm:"heartbeat",
        art:`<div class="art-gate-light"></div><div class="art-gate" style="opacity:.55"><div class="art-chain"></div></div>
             <div class="art-figure"></div><div class="art-lantern"></div><div class="art-ground"></div>`
      }
    };
    return scenes;
  })();

  window.updateGhostTownScene=function(sceneId){
    const id=String(sceneId||"courtyard");
    const sc=SCENE_DATA[id]||SCENE_DATA.courtyard;
    /* Only touch the DOM when the scene actually changed. Staying in the same
       place (picking up an item, reading a hint) now costs nothing. */
    if(id!==currentScene){
      currentScene=id;
      sky.style.background=sc.bg;
      caption.textContent=sc.cap;
      if(cinTitle) cinTitle.textContent=sc.cap;
      art.innerHTML=sc.art;
      moon.style.opacity=(id==="morning"||id==="day")?".12":"1";
      fog.style.opacity=id==="midnight"?"1":id==="gate"?".95":id==="well"?".86":".72";
      setAtmosphere(sc.atm);
    }
    panel.classList.remove("scene-pulse","scene-shock");
    void panel.offsetWidth;
    panel.classList.add("scene-pulse");
    if(id==="midnight") panel.classList.add("scene-shock");
    if(flashEl){
      flashEl.style.animation="none"; void flashEl.offsetWidth;
      if(id==="midnight" || id==="temple") flashEl.style.animation="dramaticFlash .75s ease";
    }
  };
  window.updateGhostTownScene((window.S&&window.S.scene)||"courtyard");
})();

</script>
